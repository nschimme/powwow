name: Build and CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev libgnutls28-dev libncurses-dev cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 gnutls ncurses cmake

      - name: Setup Qt (Windows MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix gnutls);$(brew --prefix ncurses)"

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -DBUILD_GUI=ON -DBUILD_SHARED_LIBS=OFF

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Package Artifact (Windows MSVC)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          New-Item -ItemType Directory -Path "powwow-windows" -Force
          if (Test-Path "build\Release\powwow-gui.exe") {
            Copy-Item "build\Release\powwow-gui.exe" "powwow-windows\"
          } elseif (Test-Path "build\powwow-gui.exe") {
            Copy-Item "build\powwow-gui.exe" "powwow-windows\"
          }
          if (Get-Command windeployqt -ErrorAction SilentlyContinue) {
            windeployqt --release powwow-windows\powwow-gui.exe
          }
          Compress-Archive -Path "powwow-windows\*" -DestinationPath "powwow-gui-windows.zip" -Force

      - name: Package Artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "build/powwow-gui.app" ]; then
            $(brew --prefix qt@6)/bin/macdeployqt build/powwow-gui.app -always-overwrite || true
            zip -r powwow-gui-macos.zip build/powwow-gui.app
          else
            zip -r powwow-gui-macos.zip build/powwow
          fi

      - name: Package Artifact (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ -f "build/powwow-gui" ]; then
            tar -czvf powwow-gui-ubuntu.tar.gz -C build powwow-gui powwow
          else
            tar -czvf powwow-gui-ubuntu.tar.gz -C build powwow
          fi

      - name: Upload Windows Archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-gui-windows.zip
          path: powwow-gui-windows.zip

      - name: Upload macOS Zip Package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-gui-macos.zip
          path: powwow-gui-macos.zip

      - name: Upload Ubuntu Archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-gui-ubuntu.tar.gz
          path: powwow-gui-ubuntu.tar.gz

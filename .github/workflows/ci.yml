name: Build and CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev libgnutls28-dev libncurses-dev cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 gnutls ncurses pkg-config cmake

      - name: Setup MSYS2 (Windows MinGW64)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-qt6-base
            mingw-w64-x86_64-qt6-tools
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-ncurses
            zip

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix gnutls)/lib/pkgconfig:$PKG_CONFIG_PATH"
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6);$(brew --prefix gnutls);$(brew --prefix ncurses)"

      - name: Configure CMake (Windows MinGW64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -B build -G "Ninja" -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXE_LINKER_FLAGS="-static -static-libgcc -static-libstdc++"

      - name: Build (Windows MinGW64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake --build build

      - name: Build (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          cmake --build build --config Release

      - name: Run CTest (Windows MinGW64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          ctest --test-dir build --output-on-failure

      - name: Run CTest (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Package Artifact (Windows MinGW64)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p powwow-windows
          cp build/powwow-gui.exe powwow-windows/ 2>/dev/null || true
          cp build/powwow.exe powwow-windows/ 2>/dev/null || true
          windeployqt --release powwow-windows/powwow-gui.exe 2>/dev/null || true
          zip -r powwow-gui-windows.zip powwow-windows

      - name: Package Artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          if [ -d "build/powwow-gui.app" ]; then
            cp build/powwow build/powwow-gui.app/Contents/MacOS/powwow 2>/dev/null || true
            $(brew --prefix qt@6)/bin/macdeployqt build/powwow-gui.app -always-overwrite || true
            codesign --force --deep -s - build/powwow-gui.app || true
            zip -r powwow-gui-macos.zip build/powwow-gui.app
          else
            zip -r powwow-gui-macos.zip build/powwow
          fi

      - name: Package Artifact (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          if [ -f "build/powwow-gui" ]; then
            tar -czvf powwow-gui-ubuntu.tar.gz -C build powwow-gui powwow
          else
            tar -czvf powwow-gui-ubuntu.tar.gz -C build powwow
          fi

      - name: Upload Windows Archive
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-gui-windows.zip
          path: powwow-gui-windows.zip

      - name: Upload macOS Zip Package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-gui-macos.zip
          path: powwow-gui-macos.zip

      - name: Upload Ubuntu Archive
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-gui-ubuntu.tar.gz
          path: powwow-gui-ubuntu.tar.gz

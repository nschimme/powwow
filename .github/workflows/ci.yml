name: Build and CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev qt6-tools-dev libgnutls28-dev libncurses-dev cmake

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qt@6 gnutls cmake

      - name: Setup Qt (Windows MSVC)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Configure CMake (Linux)
        if: runner.os == 'Linux'
        run: |
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release

      - name: Configure CMake (macOS)
        if: runner.os == 'macOS'
        run: |
          cmake -B build -DBUILD_GUI=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt@6)"

      - name: Configure CMake (Windows MSVC)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -DBUILD_GUI=ON

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build --build-config Release --output-on-failure

      - name: Upload Build Artifacts (Linux / macOS)
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-${{ matrix.os }}
          path: |
            build/powwow
            build/powwow-gui
            build/powwow-muc
            build/powwow-movieplay
          if-no-files-found: ignore

      - name: Upload Build Artifacts (Windows MSVC)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: powwow-${{ matrix.os }}
          path: |
            build/Release/powwow-gui.exe
            build/Release/*.exe
            build/*.exe
          if-no-files-found: ignore
